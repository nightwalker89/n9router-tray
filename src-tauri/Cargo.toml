[package]
name = "n9-control"
version = "0.1.0"
description = "n9router menu bar control panel"
authors = ["cuongquach"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2", features = ["default"] }
open = "5"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
