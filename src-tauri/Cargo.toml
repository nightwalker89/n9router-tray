[package]
name = "n9router-tray"
version = "0.1.4"
description = "n9router menu bar control panel"
authors = ["cuongquach"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2", features = ["default", "unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
open = "5"
once_cell = "1"

# Unix-only (macOS): process control via libc setsid + PATH fix for GUI apps.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", version = "0.0.0" }

# Windows-only: process detection, path/home lookup, timestamps, Win32 focus.
[target.'cfg(windows)'.dependencies]
sysinfo = "0.32"
which = "6"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
# Re-launch focuses the existing tray instance instead of spawning a duplicate.
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
